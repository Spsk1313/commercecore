services:
  db:
    image: postgres:17

    environment:
      POSTGRES_DB: commercecore
      POSTGRES_USER: commercecore
      POSTGRES_PASSWORD: ${COMMERCECORE_DB_PASSWORD:?Set database password in .env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "commercecore", "-d", "commercecore"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: